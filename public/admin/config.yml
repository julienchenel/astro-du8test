# Decap CMS en mode local uniquement : il écrit directement dans les fichiers
# du dépôt via `decap-server` (port 8081). Aucun serveur ni connexion en ligne.
# Le bloc `backend` est requis par Decap mais ne sert pas tant que
# `local_backend` est actif et que l'admin est ouvert sur localhost.
backend:
  name: github
  repo: julienchenel/astro-du8test
  branch: main

local_backend: true

locale: fr

media_folder: public/images
public_folder: /astro-du8test/images

collections:
  - name: articles
    label: Articles
    label_singular: Article
    folder: src/content/articles
    create: true
    slug: '{{slug}}'
    identifier_field: titre
    summary: '{{titre}} · {{date}}'
    sortable_fields: [date, titre]
    fields:
      - { name: titre, label: Titre, widget: string }
      - { name: resume, label: Résumé, widget: text }
      - name: date
        label: Date de publication
        widget: datetime
        format: YYYY-MM-DD
        date_format: DD/MM/YYYY
        time_format: false
      - name: auteur
        label: Auteur
        widget: relation
        collection: auteurs
        value_field: '{{slug}}'
        search_fields: [nom]
        display_fields: [nom]
      - { name: tags, label: Tags, widget: list, required: false, default: [] }
      - name: dureeLecture
        label: Durée de lecture (minutes)
        widget: number
        value_type: int
        min: 1
        default: 5
      - { name: body, label: Contenu, widget: markdown }

  - name: auteurs
    label: Auteurs
    label_singular: Auteur
    folder: src/content/auteurs
    create: true
    slug: '{{slug}}'
    identifier_field: nom
    fields:
      - { name: nom, label: Nom, widget: string }
      - { name: role, label: Rôle, widget: string }
      - { name: ville, label: Ville, widget: string }
      - { name: pratique, label: Pratique, widget: string }
      - { name: bio, label: Bio courte, widget: text }
      - { name: body, label: Présentation, widget: markdown }
